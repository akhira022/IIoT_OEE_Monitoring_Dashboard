# Local development Mosquitto broker.
# Anonymous access is enabled to keep the dev stack friction-free. For anything
# beyond local development, add authentication and TLS (the ESP32 firmware and
# Node-RED flow use HiveMQ Cloud with TLS on port 8883 in production).

persistence true
persistence_location /mosquitto/data/

# Plain MQTT
listener 1883
protocol mqtt

# MQTT over WebSockets (handy for browser based MQTT tooling)
listener 9001
protocol websockets

allow_anonymous true
